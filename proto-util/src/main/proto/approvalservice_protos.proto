syntax = "proto3";

package grpc; //package与java_package有些不同，java_package是定义编译生成的java文件所在的目录，而package是对应的java类的命名空间
option java_package = "com.rivers.proto";
option java_outer_classname = "ApprovalServiceProto"; //要生成Java类的名称
option java_multiple_files = true;

message LoginUser {
    string username = 1;
    string userId = 2;
}

message CreateDefinitionReq {
    string definitionKey = 1;
    string name = 2;
    string description = 3;
    string category = 4;
    string icon = 5;
    string definitionJson = 6;
    LoginUser loginUser = 7;
}

message PublishDefinitionReq {
    int64 id = 1;
    LoginUser loginUser = 2;
}

message DisableDefinitionReq {
    int64 id = 1;
    LoginUser loginUser = 2;
}

message GetDefinitionReq {
    string definitionKey = 1;
    int32 version = 2;
    LoginUser loginUser = 3;
}

message FlowDefinitionRes {
    int64 id = 1;
    string definition_key = 2;
    string name = 3;
    string description = 4;
    int32 version = 5;
    string status = 6;
    string category = 7;
    string definitionJson = 8;
    string icon = 9;
    string createUser = 10;
    string createTime = 11;
    string updateUser = 12;
    string updateTime = 13;
}

// ==================== 流程实例 ====================

message StartProcessReq {
    string definitionKey = 1;
    string title = 2;
    string businessKey = 3;
    string initiator = 4;
    string initiatorName = 5;
    string variables = 6;
    LoginUser loginUser = 7;
}

message StartProcessRes {
    int64 instanceId = 1;
    string instanceNo = 2;
    string status = 3;
}

message TerminateInstanceReq {
    int64 instanceId = 1;
    string operator = 2;
    LoginUser loginUser = 3;
}

message ListInstanceReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    LoginUser loginUser = 3;
}

message InstanceNoReq {
    string instanceNo = 1;
}

message BusinessKeyReq {
    string businessKey = 1;
}

message FlowInstanceRes {
    int64 id = 1;
    string instanceNo = 2;
    int64 definitionId = 3;
    string definitionKey = 4;
    int32 definitionVersion = 5;
    string title = 6;
    string initiator = 7;
    string initiatorName = 8;
    string businessKey = 9;
    string status = 10;
    string variables = 11;
    string currentNodeIds = 12;
    string startTime = 13;
    string endTime = 14;
    string approvalResult = 15;
    string approvalComment = 16;
    string approvedBy = 17;
}

// ==================== 任务 ====================

message ClaimTaskReq {
    string taskNo = 1;
    string instanceId = 2;
    string userId = 3;
    LoginUser loginUser = 4;
}

message CompleteTaskReq {
    string taskNo = 1;
    string result = 2;
    string comment = 3;
    string instanceId = 4;
    string userId = 5;
    LoginUser loginUser = 6;
}

message TransferTaskReq {
    string taskNo = 1;
    string targetUser = 2;
    string operator = 3;
    string instanceId = 4;
    LoginUser loginUser = 5;
}

message CancelTaskReq {
    string taskNo = 1;
    string operator = 2;
    string instanceId = 3;
    string userId = 4;
    LoginUser loginUser = 5;
}

message ListTaskReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    LoginUser loginUser = 3;
}

message TaskNoReq {
    string taskNo = 1;
}

message FlowTaskRes {
    int64 id = 1;
    int64 instanceId = 2;
    int64 nodeInstanceId = 3;
    string taskNo = 4;
    string taskName = 5;
    string status = 6;
    string assignee = 7;
    string candidateUsers = 8;
    string claimedBy = 9;
    string claimedTime = 10;
    string completedBy = 11;
    string completedTime = 12;
    string result = 13;
    string comment = 14;
    string dueTime = 15;
    int32 priority = 16;
}

message TaskListRes {
    repeated FlowTaskRes tasks = 1;
}

// ==================== 历史 ====================

message InstanceIdReq {
    int64 instanceId = 1;
    LoginUser loginUser = 2;
}

message TaskIdReq {
    int64 taskId = 1;
    string instanceId = 2;
    LoginUser loginUser = 3;
}

message OperatorHistoryReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    string operatorId = 3;
}

message FlowHistoryRes {
    int64 id = 1;
    int64 instanceId = 2;
    int64 nodeInstanceId = 3;
    int64 taskId = 4;
    string eventType = 5;
    string operatorId = 6;
    string operatorName = 7;
    // 8 废弃：原 detail(JSON) 字段，历史记录已改为结构化列
    string remark = 9;
    string createTime = 10;
    string instanceNo = 11;      // 流程实例编号
    string nodeId = 12;          // 节点ID
    string nodeName = 13;        // 节点名称
    string nodeType = 14;        // 节点类型
    string taskNo = 15;          // 任务编号
    string taskName = 16;        // 任务名称
    string assignee = 17;        // 办理人
    string targetAssignee = 18;  // 转交目标人
    string result = 19;          // 审批结果
    string opinion = 20;         // 审批意见
    string fromStatus = 21;      // 变更前状态
    string toStatus = 22;        // 变更后状态
}

message HistoryListRes {
    repeated FlowHistoryRes histories = 1;
}

message ListInstanceByStatusReq {
    string status = 1; // 实例状态: RUNNING / COMPLETED / TERMINATED
    int32 currentPage = 2; // 当前页码（从 1 开始）
    int32 pageSize = 3; // 每页条数
}

// 实例列表响应
message InstanceListRes {
    repeated FlowInstanceRes instances = 1; // 实例列表
}

message TaskActionReq {
    string taskNo = 1;
    string comment = 2;
    string instanceId = 3;
    string userId = 4;
    LoginUser loginUser = 5;
}

// 流程跟踪链视图：从发起到最后审批人的简化聚合
message FlowTrackItem {
    string nodeName = 1;       // 审批环节（发起申请/节点名称/流程结束）
    string assignee = 2;       // 审批人（发起人/实际办理人）
    string taskTime = 3;       // 任务时间（任务创建时间/发起时间）
    string approveTime = 4;    // 审批时间（未审批为空）
    string nextAssignee = 5;   // 下一处理人
    string status = 6;         // 审批状态：STARTED/PENDING/TRANSFERRED/APPROVED/REJECTED/RETURNED
    string opinion = 7;        // 审批意见（转交行为为转交原因）
}

message FlowTrackRes {
    repeated FlowTrackItem tracks = 1;
}

// ==================== 规则管理（flow_rule 流转路由） ====================

message CreateFlowRuleReq {
    string ruleCode = 1;
    string name = 2;
    string description = 3;
    int64 definitionId = 4;
    string nodeId = 5;      // 排他网关节点ID
    string ruleConfig = 6;  // JSON 数组: [{"condition":"#amount > 5000","targetNodeId":"nodeB","outputMapping":{...}}]
    int32 priority = 7;
    LoginUser loginUser = 8;
}

message UpdateFlowRuleReq {
    int64 id = 1;
    string name = 2;
    string description = 3;
    string nodeId = 4;      // ruleCode/definitionId 不可变
    string ruleConfig = 5;
    int32 priority = 6;
    LoginUser loginUser = 7;
}

message DeleteFlowRuleReq {
    int64 id = 1;
    LoginUser loginUser = 2;
}

message ToggleFlowRuleReq {
    int64 id = 1;
    int32 enabled = 2;      // 0-禁用, 1-启用
    LoginUser loginUser = 3;
}

message GetFlowRuleReq {
    int64 id = 1;
    LoginUser loginUser = 2;
}

message ListFlowRuleReq {
    int64 definitionId = 1;
    string nodeId = 2;      // 可选：按节点过滤
    int32 currentPage = 3;
    int32 pageSize = 4;
    LoginUser loginUser = 5;
}

message FlowRuleRes {
    int64 id = 1;
    string ruleCode = 2;
    string name = 3;
    string description = 4;
    string ruleType = 5;
    int64 definitionId = 6;
    string nodeId = 7;
    string ruleConfig = 8;
    int32 priority = 9;
    int32 enabled = 10;
    string createUser = 11;
    string createTime = 12;
    string updateUser = 13;
    string updateTime = 14;
}

message FlowRuleListRes {
    repeated FlowRuleRes rules = 1;
}