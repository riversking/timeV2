syntax="proto3";

package grpc;//package与java_package有些不同，java_package是定义编译生成的java文件所在的目录，而package是对应的java类的命名空间
option java_package = "com.rivers.nba";
option java_outer_classname = "NbaServiceProto";//要生成Java类的名称
option java_multiple_files = true;

message Player {
    int64 id = 1;
    int64 playerId = 21;
    string team = 2;
    int64 teamId = 3;
    int32 jersey = 4;
    string status = 5;
    string positionCategory = 6;
    string position = 7;
    string firstName = 8;
    string lastName = 9;
    int32 height = 10;
    int32 weight = 11;
    string birthDate = 12;
    string birthCity = 13;
    string birthState = 14;
    string birthCountry = 15;
    string college = 16;
    int32 salary = 17;
    string photoUrl = 18;
    int32 experience = 19;
    string draftKingsName = 20;
}

//请求参数 基于序号的协议字段映射，所以字段可以乱序，可缺段
message GetPlayersReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    string playerName = 3;
}
//响应参数
message GetPlayersRes {
    int64 total = 1;
    repeated Player players = 2;
}

message Stadium {
    int32 stadiumId = 1;
    bool active = 2;
    string name = 3;
    string address = 4;
    string city = 5;
    string state = 6;
    string zip = 7;
    string country = 8;
    int32 capacity = 9;
    double geoLat = 10;
    double geoLong = 11;
}

//球馆分页查询请求
message GetStadiumsReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    string name = 3;
}
//球馆分页查询响应
message GetStadiumsRes {
    int64 total = 1;
    repeated Stadium stadiums = 2;
}

//球队信息
message TeamInfo {
    int32 teamId = 1;
    string key = 2;
    bool active = 3;
    string city = 4;
    string name = 5;
    int32 leagueId = 6;
    int32 stadiumId = 7;
    string conference = 8;
    string division = 9;
    string primaryColor = 10;
    string secondaryColor = 11;
    string tertiaryColor = 12;
    string quaternaryColor = 13;
    string wikipediaLogoUrl = 14;
    int32 globalTeamId = 15;
    int32 nbaDotComTeamId = 16;
    string headCoach = 17;
}
//球队分页查询请求
message GetTeamsReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    string name = 3;
}
//球队分页查询响应
message GetTeamsRes {
    int64 total = 1;
    repeated TeamInfo teams = 2;
}

//当前赛季信息
message CurrentSeasonInfo {
    int32 season = 1;
    int32 startYear = 2;
    int32 endYear = 3;
    string description = 4;
    string regularSeasonStartDate = 5;
    string postSeasonStartDate = 6;
    string seasonType = 7;
    string apiSeason = 8;
}
//当前赛季查询响应
message GetCurrentSeasonRes {
    CurrentSeasonInfo currentSeason = 1;
}

//比赛信息
message GameInfo {
    int32 gameId = 1;
    int32 season = 2;
    int32 seasonType = 3;
    string status = 4;
    string day = 5;
    string dateTime = 6;
    string awayTeam = 7;
    string homeTeam = 8;
    int32 awayTeamId = 9;
    int32 homeTeamId = 10;
    int32 stadiumId = 11;
    string channel = 12;
    int32 attendance = 13;
    int32 awayTeamScore = 14;
    int32 homeTeamScore = 15;
    string updated = 16;
    bool isClosed = 17;
    string gameEndDateTime = 18;
    bool neutralVenue = 19;
    string dateTimeUtc = 20;
    bool inseasonTournament = 21;
    int32 globalGameId = 22;
    //记录主键（时间线行级游标：与比赛日组合保证翻页无重复无缺口）
    int64 id = 23;
}
//按赛季同步比赛请求
message SyncGamesBySeasonReq {
    int32 season = 1;
}
//按日期同步比赛请求
message SyncGamesByDateReq {
    string date = 1;
}
//比赛分页查询请求
message GetGamesReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    int32 season = 3;
    string date = 4;
    int32 teamId = 5;
    //时间线模式：空=普通分页；forward=锚点/游标之后（按比赛日正序）；backward=锚点/游标之前（按比赛日倒序，服务端反转为正序返回）
    string timelineMode = 6;
    //锚点日（中国观赛日，yyyy-MM-dd）：无游标时的起点，forward 含锚点日起、backward 取锚点日前
    string anchorDay = 7;
    //游标比赛日（中国观赛日）：上一批边界条目的比赛日
    string cursorDay = 8;
    //游标记录主键：上一批边界条目的 id（同日排序稳定，与 cursorDay 组成行级游标）
    int64 cursorId = 9;
}
//比赛分页查询响应
message GetGamesRes {
    int64 total = 1;
    repeated GameInfo games = 2;
}
//比赛日历查询请求
message GetGameCalendarReq {
    int32 season = 1;
    string month = 2;
    int32 teamId = 3;
}
//比赛日历按日汇总
message GameDayCount {
    string day = 1;
    int32 count = 2;
}
//比赛日历查询响应
message GetGameCalendarRes {
    repeated GameDayCount days = 1;
}
//比赛详情查询请求
message GetGameDetailReq {
    int32 gameId = 1;
}
//单节比分（period 从 1 开始，加时赛依次递增）
message PeriodScore {
    int32 period = 1;
    int32 awayScore = 2;
    int32 homeScore = 3;
}
//球员单场数据行（stats 与所属 TeamBoxScore.columns 按位对齐）
message PlayerGameStatLine {
    string name = 1;
    bool starter = 2;
    bool played = 3;
    repeated string stats = 4;
}
//球队单场数据表（columns 为数据源表头，前端按列动态渲染）
message TeamBoxScore {
    string team = 1;
    repeated string columns = 2;
    repeated PlayerGameStatLine players = 3;
}
//比赛详情（详情数据实时取外部数据源，无对应数据时仅返回基础比赛信息）
message GameDetail {
    GameInfo game = 1;
    repeated PeriodScore periods = 2;
    TeamBoxScore awayBox = 3;
    TeamBoxScore homeBox = 4;
}
//比赛详情查询响应
message GetGameDetailRes {
    GameDetail detail = 1;
}
//比分变动上报请求（后台检测到比分变化时上报并实时广播）
message ScoreReportReq {
    int32 gameId = 1;
    int32 awayTeamScore = 2;
    int32 homeTeamScore = 3;
    bool isClosed = 4;
}

//球员简档信息
message PlayerBasicInfo {
    int64 playerId = 1;
    string sportsDataId = 2;
    string status = 3;
    int32 teamId = 4;
    string team = 5;
    int32 jersey = 6;
    string positionCategory = 7;
    string position = 8;
    string firstName = 9;
    string lastName = 10;
    int32 height = 11;
    int32 weight = 12;
    string birthDate = 13;
    string birthCity = 14;
    string birthState = 15;
    string birthCountry = 16;
    string college = 17;
    int32 salary = 18;
    string photoUrl = 19;
    int32 experience = 20;
    string draftKingsName = 21;
    int32 globalTeamId = 22;
    int32 source = 23;
}
//按球队同步球员简档请求
message SyncPlayersByTeamReq {
    string team = 1;
}
//球员简档分页查询请求
message GetPlayerBasicsReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    string name = 3;
    int32 source = 4;
}
//球员简档分页查询响应
message GetPlayerBasicsRes {
    int64 total = 1;
    repeated PlayerBasicInfo playerBasics = 2;
}

//阵容深度信息
message DepthChartInfo {
    int32 teamId = 1;
    int64 playerId = 2;
    string name = 3;
    string positionCategory = 4;
    string position = 5;
    int32 depthOrder = 6;
    int32 depthChartId = 7;
    string updated = 8;
}
//阵容深度分页查询请求
message GetDepthChartsReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    int32 teamId = 3;
}
//阵容深度分页查询响应
message GetDepthChartsRes {
    int64 total = 1;
    repeated DepthChartInfo depthCharts = 2;
}

//裁判信息
message RefereeInfo {
    int64 refereeId = 1;
    string name = 2;
    int32 number = 3;
    string position = 4;
    string college = 5;
    int32 experience = 6;
}
//裁判分页查询请求
message GetRefereesReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    string name = 3;
}
//裁判分页查询响应
message GetRefereesRes {
    int64 total = 1;
    repeated RefereeInfo referees = 2;
}

//交易记录信息
message TransactionInfo {
    int64 playerId = 1;
    string name = 2;
    int32 formerTeamId = 3;
    string formerTeam = 4;
    int32 teamId = 5;
    string team = 6;
    string type = 7;
    string date = 8;
    string note = 9;
    string created = 10;
    string updated = 11;
}
//按日期同步交易请求
message SyncTransactionsByDateReq {
    string date = 1;
}
//交易分页查询请求
message GetTransactionsReq {
    int32 currentPage = 1;
    int32 pageSize = 2;
    string date = 3;
}
//交易分页查询响应
message GetTransactionsRes {
    int64 total = 1;
    repeated TransactionInfo transactions = 2;
}

//球员详情查询请求
message GetPlayerDetailReq {
    int64 playerId = 1;
}
//球员详情查询响应
message GetPlayerDetailRes {
    Player player = 1;
}

//球馆详情查询请求
message GetStadiumDetailReq {
    int32 stadiumId = 1;
}
//球馆详情查询响应
message GetStadiumDetailRes {
    Stadium stadium = 1;
}

//球队详情查询请求
message GetTeamDetailReq {
    int32 teamId = 1;
}
//球队详情查询响应
message GetTeamDetailRes {
    TeamInfo team = 1;
}

//新闻资讯条目
message NewsItem {
    string title = 1;
    string description = 2;
    string published = 3;
    string imageUrl = 4;
    string link = 5;
    string type = 6;
    //数据源文章ID（详情查询用）
    string id = 7;
}
//新闻查询请求
message GetNewsReq {
    int32 limit = 1;
}
//新闻查询响应
message GetNewsRes {
    repeated NewsItem news = 1;
}
//新闻详情查询请求
message GetNewsDetailReq {
    string id = 1;
}
//新闻详情
message NewsDetail {
    string id = 1;
    string title = 2;
    string description = 3;
    string published = 4;
    string imageUrl = 5;
    string link = 6;
    string byline = 7;
    //正文HTML（服务端已清洗白名单标签）
    string content = 8;
}
//新闻详情查询响应
message GetNewsDetailRes {
    NewsDetail detail = 1;
}

//球队排名条目（东西部/分区排名由服务端按胜率计算，上游 ConferenceRank/DivisionRank 字段不可信）
message TeamStandingInfo {
    int32 teamId = 1;
    string key = 2;
    string city = 3;
    string name = 4;
    string conference = 5;
    string division = 6;
    int32 wins = 7;
    int32 losses = 8;
    double winPct = 9;
    double gamesBack = 10;
    int32 conferenceRank = 11;
    int32 divisionRank = 12;
    int32 lastTenWins = 13;
    int32 lastTenLosses = 14;
    string streakDescription = 15;
    double pointsPerGameFor = 16;
    double pointsPerGameAgainst = 17;
}
//球队排名查询请求（season 非正数时自动取最近有数据的赛季）
message GetTeamStandingsReq {
    int32 season = 1;
}
//球队排名查询响应
message GetTeamStandingsRes {
    int32 season = 1;
    repeated TeamStandingInfo standings = 2;
}

//球员数据排名条目（value 为场均数值，命中率为百分比）
message PlayerStatLeaderInfo {
    int64 playerId = 1;
    string name = 2;
    string team = 3;
    string position = 4;
    int32 games = 5;
    double value = 6;
    string photoUrl = 7;
}
//球员数据排名查询请求（statType：points/rebounds/assists/steals/blocks/threePointers/fieldGoalPercentage）
message GetPlayerStatLeadersReq {
    int32 season = 1;
    string statType = 2;
    int32 limit = 3;
}
//球员数据排名查询响应
message GetPlayerStatLeadersRes {
    int32 season = 1;
    string statType = 2;
    repeated PlayerStatLeaderInfo leaders = 3;
}
