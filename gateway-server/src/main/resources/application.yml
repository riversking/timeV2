spring:
  reactor:
    netty:
      leak-detection: paranoid
  application:
    name: gateway-server
  config:
    import: nacos:gateway-server.yml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            - AddResponseHeader=X-Response-Default-Foo, Default-Bar
          routes:
            - id: user-server
              uri: lb://user-server
              predicates:
                - Path=/user-server/**
              filters:
                - StripPrefix=1
            - id: batch-server
              uri: lb://batch-server
              predicates:
                - Path=/batch-server/**
              filters:
                - StripPrefix=1
            - id: im-server
              uri: lb://im-server
              predicates:
                - Path=/im-server/**
              filters:
                - StripPrefix=1
            - id: approval-server
              uri: lb://approval-server
              predicates:
                - Path=/approval-server/**
              filters:
                - StripPrefix=1


ignore:
  urls:
    - /actuator/**
    - /user-server/login
    - /user-server/logout
    - /user-server/refresh
    - /im-server/ws/**
    # NBA 客户端公开接口（列表/新闻/赛程免登录访问，详情接口仍需认证）
    - /nba-server/news/**
    - /nba-server/player/getPlayerPage
    - /nba-server/stadium/getStadiumPage
    - /nba-server/team/getTeamPage
    - /nba-server/game/getGamePage
    - /nba-server/game/getRecentGames
    - /nba-server/game/getGameCalendar
    - /nba-server/game/getGameDetail
    # 门户排行榜（球队排名/球员数据排名，免登录）
    - /nba-server/ranking/getTeamStandings
    - /nba-server/ranking/getPlayerStatLeaders
    # 门户菜单（后台配置、接口下发，门户导航与动态路由共用；菜单管理接口仍需认证）
    - /user-server/menu/getPortalMenuTree
    # 比分实时推送流（SSE 长连接，前台免登录订阅）
    - /nba-server/game/scoreStream

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    io.netty.util.ResourceLeakDetector: DEBUG
